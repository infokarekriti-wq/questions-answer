<style>
.pop-in{animation:popIn .3s cubic-bezier(.175,.885,.32,1.275)}

.vehicle-card{transition:all .2s ease}

<h1 class="text-xl md:text-2xl font-bold text-sky-600 tracking-wide">Look at the pictures and write their names in the correct table.</h1>

</div>
</div>

];
let selectedVehicleId=null;let isEvaluated=false;
function initQuiz(){
const bank=document.getElementById('vehicle-bank');bank.innerHTML='';
document.getElementById('zone-land').innerHTML='';document.getElementById('zone-air').innerHTML='';document.getElementById('zone-water').innerHTML='';
vehicles.forEach(vehicle=>{bank.insertAdjacentHTML('beforeend',`<div id="${vehicle.id}" data-category="${vehicle.category}" class="vehicle-card pop-in bg-white rounded-lg shadow border-2 border-gray-200 p-2 cursor-pointer flex items-center gap-3 w-40 sm:w-48" onclick="selectVehicle('${vehicle.id}')"><img src="${vehicle.img}" alt="${vehicle.name}" onerror="this.onerror=null;this.src='https://placehold.co/150x150/e2e8f0/475569?text=${encodeURIComponent(vehicle.name)}';" class="w-12 h-12 rounded object-cover pointer-events-none" draggable="false"><span class="font-bold text-gray-700 text-sm pointer-events-none leading-tight">${vehicle.name}</span></div>`);});
}
function selectVehicle(id){if(isEvaluated)return;if(selectedVehicleId){const prevEl=document.getElementById(selectedVehicleId);if(prevEl)prevEl.classList.remove('ring-4','ring-sky-400','border-sky-400');}if(selectedVehicleId===id){selectedVehicleId=null;highlightZones(false);}else{selectedVehicleId=id;document.getElementById(id).classList.add('ring-4','ring-sky-400','border-sky-400');highlightZones(true);}}
function highlightZones(enable){document.querySelectorAll('.drop-zone').forEach(zone=>{enable?zone.classList.add('zone-highlight'):zone.classList.remove('zone-highlight');});}
function moveToZone(zoneId){if(isEvaluated||!selectedVehicleId)return;const zone=document.getElementById(zoneId);const vehicleEl=document.getElementById(selectedVehicleId);zone.appendChild(vehicleEl);vehicleEl.classList.remove('ring-4','ring-sky-400','border-sky-400');selectedVehicleId=null;highlightZones(false);}
function checkAnswers(){if(isEvaluated)return;const bankItems=document.getElementById('vehicle-bank').children.length;const resultsArea=document.getElementById('results-area');if(bankItems>0){resultsArea.innerHTML='<span class="text-orange-500">Please sort all vehicles first!</span>';resultsArea.classList.remove('hidden');return;}isEvaluated=true;let score=0;const zones={'zone-land':'land','zone-air':'air','zone-water':'water'};for(const [zoneId,expectedCategory] of Object.entries(zones)){const items=document.getElementById(zoneId).children;for(let i=0;i<items.length;i++){const item=items[i];item.classList.remove('border-gray-200');if(item.getAttribute('data-category')===expectedCategory){score++;item.classList.add('bg-green-50','border-green-500');item.innerHTML+='<span class="ml-auto text-green-600 font-bold text-lg">✓</span>';}else{item.classList.add('bg-red-50','border-red-500');item.innerHTML+='<span class="ml-auto text-red-600 font-bold text-lg">✗</span>';}}}document.getElementById('check-btn').classList.add('hidden');document.getElementById('retry-btn').classList.remove('hidden');resultsArea.classList.remove('hidden');if(score===vehicles.length){resultsArea.innerHTML=`<span class="text-green-600">Perfect! You sorted all ${score} vehicles correctly! 🏆</span>`;}else{resultsArea.innerHTML=`<span class="text-orange-600">You got ${score} out of ${vehicles.length} correct.</span>`;}}
function resetQuiz(){selectedVehicleId=null;isEvaluated=false;highlightZones(false);document.getElementById('check-btn').classList.remove('hidden');document.getElementById('retry-btn').classList.add('hidden');document.getElementById('results-area').classList.add('hidden');initQuiz();}
window.onload=initQuiz;
</script>
