<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f9ff;
padding:10px;
margin:0;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:15px;
border-radius:15px;
}

/* IMAGE ROW */
.row{
position:relative;
margin-bottom:25px;
}

.row img{
width:100%;
display:block;
border-radius:10px;
}

/* CIRCLE */
.circle{
position:absolute;
width:30px;
height:30px;
border-radius:50%;
border:3px solid orange;
background:#fff;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.circle.active{
background:#2ecc71;
color:#fff;
border-color:#2ecc71;
}

/* TOP ROW */
.t1{top:80%; left:12%;}
.t2{top:80%; left:37%;}
.t3{top:80%; left:62%;}
.t4{top:80%; left:87%; transform:translateX(-100%);}

/* BOTTOM ROW */
.b1{top:80%; left:12%;}
.b2{top:80%; left:37%;}
.b3{top:80%; left:62%;}
.b4{top:80%; left:87%; transform:translateX(-100%);}

/* BUTTONS */
.btn{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:20px;
cursor:pointer;
color:#fff;
}

.check{background:#0099cc;}
.reset{background:#e74c3c;}

.btn-group{
text-align:center;
}

/* RESULT */
#result{
margin-top:10px;
text-align:center;
font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){
.circle{
width:24px;
height:24px;
font-size:12px;
}
}

</style>
</head>

<div class="circle b1" onclick="toggle(this)">✓</div>
<div class="circle b2" onclick="toggle(this)">✓</div>
<div class="circle b3" onclick="toggle(this)">✓</div>
<div class="circle b4" onclick="toggle(this)">✓</div>

</div>

<div class="btn-group">
<button class="btn check" onclick="check()">Check Answer</button>
<button class="btn reset" onclick="resetAll()">Reset</button>
</div>

<div id="result"></div>

</div>

<script>

/* TOGGLE */
function toggle(el){
el.classList.toggle("active");
}

/* CHECK */
function check(){

let circles=document.querySelectorAll(".circle");

/* 👉 CHANGE THIS BASED ON CORRECT IMAGES */
let correctIndexes=[1,2,6]; 

let correct=0, wrong=0;

circles.forEach((c,i)=>{

if(c.classList.contains("active")){
    if(correctIndexes.includes(i)){
        correct++;
        c.style.background="#2ecc71"; // green
    }else{
        wrong++;
        c.style.background="#e74c3c"; // red
    }
}else{
    if(correctIndexes.includes(i)){
        c.style.borderColor="#2ecc71"; // missed correct
    }
}

});

document.getElementById("result").innerHTML =
"✅ Correct: "+correct+" | ❌ Incorrect: "+wrong;

}

/* RESET */
function resetAll(){

let circles=document.querySelectorAll(".circle");

circles.forEach(c=>{
    c.classList.remove("active");
    c.style.background="#fff";
    c.style.borderColor="orange";
});

document.getElementById("result").innerHTML="";

}

</script>
