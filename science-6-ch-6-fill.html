<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Fill in the blanks</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#dff6ff,#ffffff,#e8f5e9);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.quiz-box{
width:100%;
max-width:980px;
background:#ffffff;
border-radius:30px;
padding:35px 28px 40px;
border:5px solid #00b8f0;
box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

.heading{
font-size:30px;
font-weight:700;
color:#00a6d6;
margin-bottom:25px;
}

.question-box{
background:#f9fcff;
border:2px solid #c9efff;
border-radius:22px;
padding:20px;
margin-bottom:18px;
}

.question{
font-size:20px;
line-height:1.8;
}

.blank-input{
width:180px;
border:none;
border-bottom:3px solid #888;
font-size:18px;
text-align:center;
outline:none;
margin:0 5px;
transition:0.3s;
}

/* COLORS */

.blank-input.correct{
border-color:#2e7d32;
color:#1b5e20;
font-weight:700;
}

.blank-input.wrong{
border-color:#c62828;
color:#b71c1c;
font-weight:700;
}

/* BUTTONS */

.buttons{
text-align:center;
margin-top:25px;
}

.check-btn,
.reset-btn{
background:linear-gradient(135deg,#ff9800,#ff6f00);
color:#fff;
border:none;
padding:12px 25px;
border-radius:30px;
font-weight:600;
cursor:pointer;
margin:5px;
}

.result{
text-align:center;
margin-top:15px;
font-size:22px;
font-weight:700;
}

/* MOBILE */

@media(max-width:768px){

.quiz-box{
padding:22px 16px 30px;
}

.heading{
font-size:24px;
}

.question{
font-size:16px;
line-height:1.7;
}

.blank-input{
width:110px;
font-size:14px;
}

.check-btn,
.reset-btn{
width:100%;
}

}

</style>
</head>

<body>

<div class="quiz-box">

<div class="heading">
Fill in the blanks
</div>

<!-- QUESTION A -->

<div class="question-box">
<div class="question">
a. Common salt is 
<input class="blank-input" id="q1">
in water.
</div>
</div>

<!-- QUESTION B -->

<div class="question-box">
<div class="question">
b. Metals are good 
<input class="blank-input" id="q2">
of electricity.
</div>
</div>

<!-- QUESTION C -->

<div class="question-box">
<div class="question">
c. Gases do not have fixed 
<input class="blank-input" id="q3">
and 
<input class="blank-input" id="q4">.
</div>
</div>

<!-- QUESTION D -->

<div class="question-box">
<div class="question">
d. Density of iron is 
<input class="blank-input" id="q5">
than water.
</div>
</div>

<!-- QUESTION E -->

<div class="question-box">
<div class="question">
e. Some materials 
<input class="blank-input" id="q6">
in water and some materials 
<input class="blank-input" id="q7">
on water.
</div>
</div>

<!-- QUESTION F -->

<div class="question-box">
<div class="question">
f. The mass per unit volume of a material is known as its 
<input class="blank-input" id="q8">.
</div>
</div>

<!-- BUTTONS -->

<div class="buttons">

<button class="check-btn" onclick="checkAnswers()">
Check Answers
</button>

<button class="reset-btn" onclick="resetQuiz()">
Reset
</button>

</div>

<!-- RESULT -->

<div class="result" id="result">
Score: 0 / 6
</div>

</div>

<script>

const answers = {

q1:"soluble",
q2:"conductors",
q3:"shape",
q4:"volume",
q5:"more",
q6:"sink",
q7:"float",
q8:"density"

};

function checkAnswers(){

let score = 0;

Object.keys(answers).forEach(id=>{

let input = document.getElementById(id);

let val = input.value.toLowerCase().trim();

let correct = answers[id];

input.classList.remove("correct","wrong");

if(val === correct){

input.classList.add("correct");

score++;

}else{

input.classList.add("wrong");


}

});

document.getElementById("result").innerText =
`Score: ${score} / 6`;

}

function resetQuiz(){

Object.keys(answers).forEach(id=>{

let input = document.getElementById(id);

input.value = "";

input.classList.remove("correct","wrong");

});

document.getElementById("result").innerText =
"Score: 0 / 6";

}

</script>

</body>
</html>
