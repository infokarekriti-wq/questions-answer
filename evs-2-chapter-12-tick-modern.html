<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Instruments of Communication</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:#f0f7ff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  .top-bar{width:100%;max-width:730px;display:flex;align-items:flex-start;
    justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .top-bar h1{font-family:'Baloo 2',cursive;font-size:1.25rem;color:#1e3a5f;font-weight:800;max-width:500px;line-height:1.3;}
  .top-bar h1 b{color:#2563eb;}
  .top-bar h1 .tick{color:#16a34a;}
  .badge{background:#f97316;color:#fff;font-weight:800;font-size:0.68rem;
    letter-spacing:2px;padding:5px 14px;border-radius:5px;text-transform:uppercase;white-space:nowrap;}
  .card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,0.09);
    padding:20px;width:100%;max-width:730px;}
  #canvas{display:block;width:100%;max-width:690px;margin:0 auto;}
  .btn-row{display:flex;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap;}
  .main-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.9rem;
    padding:10px 26px;border-radius:99px;border:none;cursor:pointer;
    transition:transform 0.1s,box-shadow 0.15s;}
  .main-btn:active{transform:scale(0.96);}
  .btn-check{background:#0ea5e9;color:#fff;box-shadow:0 4px 14px rgba(14,165,233,0.3);}
  .btn-check:hover{box-shadow:0 6px 20px rgba(14,165,233,0.4);}
  .btn-reset{background:#e2e8f0;color:#475569;}
  .btn-reset:hover{background:#cbd5e1;}
  .status-msg{font-size:0.83rem;font-weight:700;color:#64748b;
    text-align:center;margin-top:10px;min-height:20px;}
  .status-msg.ok{color:#16a34a;}
  .status-msg.err{color:#dc2626;}
  .score-banner{display:none;margin-top:14px;padding:13px 28px;border-radius:14px;
    text-align:center;font-family:'Baloo 2',cursive;font-size:1.2rem;font-weight:800;
    box-shadow:0 4px 18px rgba(0,0,0,0.09);}
  .score-banner.show{display:block;}
  .score-banner.perfect{background:#dcfce7;color:#14532d;}
  .score-banner.partial{background:#fef9c3;color:#713f12;}
  .score-banner.poor{background:#fee2e2;color:#7f1d1d;}
  .score-banner .sub{font-family:'Nunito',sans-serif;font-size:0.82rem;
    font-weight:600;margin-top:4px;opacity:0.8;}
</style>
</head>

  <div class="status-msg" id="status-msg">👆 Click on the modern communication instruments to tick (✓) them.</div>
</div>
<div class="btn-row">
  <button class="main-btn btn-check" onclick="checkAll()">✅ Check Answers</button>
  <button class="main-btn btn-reset" onclick="resetAll()">🔄 Try Again</button>
</div>
<div class="score-banner" id="score-banner">
  <div id="score-text"></div>
  <div class="sub" id="score-sub"></div>
</div>
<script>
  const ITEMS   = ['fax', 'tablet', 'horse', 'smoke', 'flags', 'pigeon', 'computer', 'phones'];
  const CORRECT = {"fax":true,"tablet":true,"horse":false,"smoke":false,"flags":false,"pigeon":false,"computer":true,"phones":true};
  const ticked  = {};

  function setStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
  }

  function toggleTick(name) {
    ticked[name] = !ticked[name];
    const circle = document.getElementById('circle-' + name);
    const tick   = document.getElementById('tick-'   + name);
    const card   = document.getElementById('card-'   + name);
    if (ticked[name]) {
      circle.setAttribute('fill','#2563eb');
      circle.setAttribute('stroke','#2563eb');
      tick.setAttribute('fill','white');
      card.setAttribute('stroke','#2563eb');
      card.setAttribute('stroke-width','2.5');
    } else {
      circle.setAttribute('fill','white');
      circle.setAttribute('stroke','#cbd5e1');
      tick.setAttribute('fill','transparent');
      card.setAttribute('stroke','#e2e8f0');
      card.setAttribute('stroke-width','2');
    }
    // Reset any check colors
    card.classList.remove('correct','wrong');
  }

  function checkAll() {
    let correct = 0;
    ITEMS.forEach(function(name) {
      const card   = document.getElementById('card-'   + name);
      const circle = document.getElementById('circle-' + name);
      const tick   = document.getElementById('tick-'   + name);
      const userTicked = !!ticked[name];
      const shouldTick = CORRECT[name];
      card.setAttribute('stroke-width','3');
      if (userTicked === shouldTick) {
        correct++;
        card.setAttribute('stroke','#16a34a');
        circle.setAttribute('fill', shouldTick ? '#16a34a' : 'white');
        circle.setAttribute('stroke','#16a34a');
        if (shouldTick) tick.setAttribute('fill','white');
      } else {
        card.setAttribute('stroke','#dc2626');
        circle.setAttribute('fill', userTicked ? '#dc2626' : 'white');
        circle.setAttribute('stroke','#dc2626');
        if (userTicked) tick.setAttribute('fill','white');
      }
    });
    const banner = document.getElementById('score-banner');
    document.getElementById('score-text').textContent = '🎯 You got ' + correct + ' / 8 correct!';
    if (correct === 8) {
      banner.className='score-banner show perfect';
      document.getElementById('score-sub').textContent='Perfect! You identified all modern communication instruments! 🌟';
    } else if (correct >= 6) {
      banner.className='score-banner show partial';
      document.getElementById('score-sub').textContent='Good job! Review the highlighted ones and try again.';
    } else {
      banner.className='score-banner show poor';
      document.getElementById('score-sub').textContent='Keep practising! Think about which are MODERN communication tools.';
    }
    setStatus('');
  }

  function resetAll() {
    ITEMS.forEach(function(name) {
      ticked[name] = false;
      document.getElementById('card-'+name).setAttribute('stroke','#e2e8f0');
      document.getElementById('card-'+name).setAttribute('stroke-width','2');
      document.getElementById('circle-'+name).setAttribute('fill','white');
      document.getElementById('circle-'+name).setAttribute('stroke','#cbd5e1');
      document.getElementById('tick-'+name).setAttribute('fill','transparent');
    });
    document.getElementById('score-banner').className='score-banner';
    setStatus('👆 Click on the modern communication instruments to tick them.');
  }
</script>
