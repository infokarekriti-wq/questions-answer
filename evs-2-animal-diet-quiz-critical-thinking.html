<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Diet Quiz - Critical Thinking</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        .pop{
            animation:popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        @keyframes popIn{

            0%{
                transform:scale(0.5);
                opacity:0;
            }

            100%{
                transform:scale(1);
                opacity:1;
            }

        }

        .animal-image{
            width:100%;
            height:140px;
            object-fit:cover;
        }

        @media(max-width:768px){

            .animal-image{
                height:110px;
            }

        }

    </style>

</head>

<body class="bg-teal-50 min-h-screen p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">

        <!-- Header -->

        <div class="bg-teal-600 text-white p-6 md:p-8 flex flex-col items-center justify-center">

            <p class="text-lg md:text-xl font-medium text-center leading-relaxed">
                Tick (✓) the animals that eat meat and Cross (✗) the animals that eat plants.
            </p>

        </div>

        <!-- Quiz Grid -->

        <div class="p-6 md:p-8">

            <div id="quiz-grid"
                class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            </div>

            <!-- Submit -->

            <div class="mt-12 text-center border-t border-gray-100 pt-8">

                <button
                    onclick="checkAnswers()"
                    class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors text-lg">

                    Check Answers

                </button>

                <div id="results-area"
                    class="mt-6 text-xl font-bold hidden">
                </div>

            </div>

        </div>

    </div>

<script>

const animals = [

{
id:'zebra',
imageUrl:'https://images.unsplash.com/photo-1526095179574-86e545346ae6?auto=format&fit=crop&w=500&q=80',
expectedSymbol:'✗'
},

{
id:'fox',
imageUrl:'https://images.unsplash.com/photo-1516934024742-b461fba47600?auto=format&fit=crop&w=500&q=80',
expectedSymbol:'✓'
},

{
id:'tiger',
imageUrl:'https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&w=500&q=80',
expectedSymbol:'✓'
},

{
id:'lion',
imageUrl:'https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?auto=format&fit=crop&w=500&q=80',
expectedSymbol:'✓'
},

{
id:'tiger2',
imageUrl:'https://images.unsplash.com/photo-1549480017-d76466a4b7e8?auto=format&fit=crop&w=500&q=80',
expectedSymbol:'✓'
},

{
id:'deer',
imageUrl:'https://images.unsplash.com/photo-1484406566174-9da000fda645?auto=format&fit=crop&w=500&q=80',
expectedSymbol:'✗'
}

];

let userAnswers = {};

function renderQuiz(){

const grid = document.getElementById('quiz-grid');

grid.innerHTML = '';

animals.forEach(animal => {

const card = document.createElement('div');

card.className =
"flex flex-col gap-3 bg-white rounded-xl p-3 shadow border border-gray-200";

card.innerHTML = `

<div class="relative rounded-xl overflow-hidden border border-gray-200 bg-gray-100">

<img
src="${animal.imageUrl}"
class="animal-image"
/>

<div
id="box-${animal.id}"
class="absolute bottom-2 right-2 w-9 h-9 bg-white border-2 border-gray-400 rounded-md shadow flex items-center justify-center text-2xl font-black text-gray-800 transition-colors">
</div>

</div>

<div class="grid grid-cols-2 gap-2">

<button
onclick="selectDiet('${animal.id}','meat')"
id="btn-meat-${animal.id}"
class="py-2 text-sm font-bold rounded border-2 border-gray-200 hover:border-green-500 hover:bg-green-50 transition-colors">

<span class="text-green-600 mr-1">✓</span>
Meat

</button>

<button
onclick="selectDiet('${animal.id}','plants')"
id="btn-plants-${animal.id}"
class="py-2 text-sm font-bold rounded border-2 border-gray-200 hover:border-red-500 hover:bg-red-50 transition-colors">

<span class="text-red-500 mr-1">✗</span>
Plants

</button>

</div>

<div
id="feedback-${animal.id}"
class="text-center text-sm font-bold h-5">
</div>

`;

grid.appendChild(card);

});

}

function selectDiet(animalId,dietType){

const symbol =
dietType === 'meat' ? '✓' : '✗';

const symbolColor =
dietType === 'meat'
? 'text-green-600'
: 'text-red-600';

userAnswers[animalId] = symbol;

const box =
document.getElementById(`box-${animalId}`);

box.innerHTML = `
<span class="${symbolColor} pop">
${symbol}
</span>
`;

document.getElementById(`btn-meat-${animalId}`)
.classList.remove('bg-green-100','border-green-500');

document.getElementById(`btn-plants-${animalId}`)
.classList.remove('bg-red-100','border-red-500');

if(dietType === 'meat'){

document.getElementById(`btn-meat-${animalId}`)
.classList.add('bg-green-100','border-green-500');

}else{

document.getElementById(`btn-plants-${animalId}`)
.classList.add('bg-red-100','border-red-500');

}

document.getElementById(`feedback-${animalId}`)
.innerHTML = '';

}

function checkAnswers(){

let score = 0;

let total = animals.length;

let allAnswered = true;

animals.forEach(animal => {

const feedbackDiv =
document.getElementById(`feedback-${animal.id}`);

const userAnswer =
userAnswers[animal.id];

if(!userAnswer){

allAnswered = false;

feedbackDiv.innerHTML =
"Please select an answer";

feedbackDiv.className =
"text-center text-sm font-bold h-5 text-orange-500";

return;

}

if(userAnswer === animal.expectedSymbol){

score++;

feedbackDiv.innerHTML = "Correct!";

feedbackDiv.className =
"text-center text-sm font-bold h-5 text-green-600";

}else{

feedbackDiv.innerHTML = "Incorrect";

feedbackDiv.className =
"text-center text-sm font-bold h-5 text-red-600";

}

});

const resultsArea =
document.getElementById('results-area');

resultsArea.classList.remove('hidden');

if(!allAnswered){

resultsArea.innerHTML = `
<span class="text-orange-500 pop">
Please answer all questions before checking!
</span>
`;

}else{

const percentage =
(score / total) * 100;

let message =
percentage === 100
? "Perfect! 🎉"
: "Good try! 💡";

let colorClass =
percentage === 100
? "text-green-600"
: "text-teal-600";

resultsArea.innerHTML = `
<div class="${colorClass} pop">
You scored ${score} out of ${total}
<br>
<span class="text-lg font-medium">
${message}
</span>
</div>
`;

}

}

renderQuiz();

</script>

</body>
</html>
