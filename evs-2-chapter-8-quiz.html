<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matching Activity</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#e0f7ff,#fff4d6);
padding:10px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:100%;
max-width:950px;
background:white;
padding:15px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
border:4px solid #4fc3f7;
}

.heading{
text-align:center;
font-size:22px;
font-weight:bold;
color:#0091c7;
margin-bottom:20px;
}

.match-area{
position:relative;
}

svg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
}

.match-wrapper{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
position:relative;
z-index:2;
}

.left-side,
.right-side{
display:flex;
flex-direction:column;
gap:12px;
}

.item{
background:#f5fbff;
border:2px solid #b3e5fc;
padding:10px 12px;
border-radius:12px;
font-size:14px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
line-height:1.4;
position:relative;
}

.item:hover{
background:#e3f2fd;
}

.item.selected{
border:2px solid #1976d2;
background:#dbeafe;
}

.item.correct{
background:#c8f7c5;
border-color:#2e7d32;
color:#1b5e20;
}

.item.wrong{
background:#ffcdd2;
border-color:#c62828;
color:#b71c1c;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

button{
border:none;
padding:10px 20px;
font-size:14px;
font-weight:bold;
border-radius:25px;
cursor:pointer;
color:white;
}

.check-btn{
background:#28a745;
}

.reset-btn{
background:#1565d8;
}

.score{
margin-top:15px;
text-align:center;
font-size:18px;
font-weight:bold;
color:#0b45a0;
}

@media(max-width:700px){

.match-wrapper{
grid-template-columns:1fr;
gap:20px;
}

svg{
display:none;
}

.heading{
font-size:18px;
}

.item{
font-size:13px;
padding:9px 10px;
}

button{
font-size:13px;
padding:9px 18px;
}

.score{
font-size:16px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="heading">
Match the Following
</div>

<div class="match-area">

<svg id="lines"></svg>

<div class="match-wrapper">

<!-- LEFT -->

<div class="left-side">

<div class="item left-item" data-match="d" onclick="selectLeft(this)">
1. Home
</div>

<div class="item left-item" data-match="c" onclick="selectLeft(this)">
2. Neighbourhood
</div>

<div class="item left-item" data-match="a" onclick="selectLeft(this)">
3. Neighbour
</div>

<div class="item left-item" data-match="b" onclick="selectLeft(this)">
4. Tent
</div>

</div>

<!-- RIGHT -->

<div class="right-side">

<div class="item right-item" data-id="a" onclick="matchRight(this)">
a. A person who lives near us
</div>

<div class="item right-item" data-id="b" onclick="matchRight(this)">
b. Temporary home
</div>

<div class="item right-item" data-id="c" onclick="matchRight(this)">
c. Area around our house
</div>

<div class="item right-item" data-id="d" onclick="matchRight(this)">
d. A place where we live
</div>

</div>

</div>

</div>

<div class="buttons">

<button class="check-btn" onclick="checkAnswers()">
Check Answers
</button>

<button class="reset-btn" onclick="resetGame()">
Reset
</button>

</div>

<div class="score" id="score">
Score: 0 / 4
</div>

</div>

<script>

let selectedLeft = null;
let matches = [];
let score = 0;

function selectLeft(item){

document.querySelectorAll('.left-item').forEach(i=>{
i.classList.remove('selected');
});

item.classList.add('selected');
selectedLeft = item;

}

function matchRight(rightItem){

if(!selectedLeft) return;

const existing = matches.find(m => m.left === selectedLeft);

if(existing){
existing.right.classList.remove('selected');
matches = matches.filter(m => m.left !== selectedLeft);
}

rightItem.classList.add('selected');

matches.push({
left:selectedLeft,
right:rightItem
});

drawLines();

selectedLeft.classList.remove('selected');
selectedLeft = null;

}

function drawLines(){

const svg = document.getElementById('lines');
svg.innerHTML = "";

matches.forEach(match=>{

const leftRect = match.left.getBoundingClientRect();
const rightRect = match.right.getBoundingClientRect();
const parentRect = document.querySelector('.match-area').getBoundingClientRect();

const x1 = leftRect.right - parentRect.left;
const y1 = leftRect.top + leftRect.height/2 - parentRect.top;

const x2 = rightRect.left - parentRect.left;
const y2 = rightRect.top + rightRect.height/2 - parentRect.top;

const line = document.createElementNS("http://www.w3.org/2000/svg","line");

line.setAttribute("x1",x1);
line.setAttribute("y1",y1);
line.setAttribute("x2",x2);
line.setAttribute("y2",y2);

line.setAttribute("stroke","#ff9800");
line.setAttribute("stroke-width","3");

svg.appendChild(line);

});

}

function checkAnswers(){

score = 0;

document.querySelectorAll('.item').forEach(item=>{
item.classList.remove('correct');
item.classList.remove('wrong');
});

matches.forEach(match=>{

const leftMatch = match.left.dataset.match;
const rightMatch = match.right.dataset.id;

if(leftMatch === rightMatch){

match.left.classList.add('correct');
match.right.classList.add('correct');

score++;

}else{

match.left.classList.add('wrong');
match.right.classList.add('wrong');

}

});

document.getElementById('score').innerHTML =
`Score: ${score} / 4`;

}

function resetGame(){

matches = [];
score = 0;
selectedLeft = null;

document.querySelectorAll('.item').forEach(item=>{

item.classList.remove('selected');
item.classList.remove('correct');
item.classList.remove('wrong');

});

document.getElementById('lines').innerHTML = "";

document.getElementById('score').innerHTML =
'Score: 0 / 4';

}

window.addEventListener('resize',drawLines);

</script>

</body>
</html>
