<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Wheels with Vehicles</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:#f0f7ff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  .top-bar{width:100%;max-width:740px;display:flex;align-items:center;
    justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .top-bar h1{font-family:'Baloo 2',cursive;font-size:1.3rem;color:#1e3a5f;font-weight:800;}
  .top-bar h1 b{color:#2563eb;}
  .badge{background:#f97316;color:#fff;font-weight:800;font-size:0.68rem;
    letter-spacing:2px;padding:5px 14px;border-radius:5px;text-transform:uppercase;}
  .card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,0.09);
    padding:20px;width:100%;max-width:740px;}
  #canvas{display:block;width:100%;max-width:700px;margin:0 auto;}
  .btn-row{display:flex;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap;}
  .main-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.9rem;
    padding:10px 26px;border-radius:99px;border:none;cursor:pointer;
    transition:transform 0.1s,box-shadow 0.15s;}
  .main-btn:active{transform:scale(0.96);}
  .btn-check{background:#0ea5e9;color:#fff;box-shadow:0 4px 14px rgba(14,165,233,0.3);}
  .btn-check:hover{box-shadow:0 6px 20px rgba(14,165,233,0.4);}
  .btn-reset{background:#e2e8f0;color:#475569;}
  .btn-reset:hover{background:#cbd5e1;}
  .status-msg{font-size:0.83rem;font-weight:700;color:#64748b;
    text-align:center;margin-top:10px;min-height:20px;}
  .status-msg.ok{color:#16a34a;}
  .status-msg.err{color:#dc2626;}
  .score-banner{display:none;margin-top:14px;padding:13px 28px;border-radius:14px;
    text-align:center;font-family:'Baloo 2',cursive;font-size:1.2rem;font-weight:800;
    box-shadow:0 4px 18px rgba(0,0,0,0.09);}
  .score-banner.show{display:block;}
  .score-banner.perfect{background:#dcfce7;color:#14532d;}
  .score-banner.partial{background:#fef9c3;color:#713f12;}
  .score-banner.poor{background:#fee2e2;color:#7f1d1d;}
  .score-banner .sub{font-family:'Nunito',sans-serif;font-size:0.82rem;
    font-weight:600;margin-top:4px;opacity:0.8;}
</style>
</head>

           x="450" y="355" width="220" height="100"
           preserveAspectRatio="xMidYMid meet"
           style="cursor:pointer" onclick="placeWheel('car')"/>
    <circle id="vdot-car" cx="430" cy="405" r="8"
            fill="white" stroke="#94a3b8" stroke-width="2.5"
            style="cursor:pointer" onclick="placeWheel('car')"/>
    <text id="vtag-car" x="340" y="405"
          font-family="'Baloo 2',cursive" font-size="10" font-weight="700"
          fill="#1e3a5f" dominant-baseline="central" text-anchor="start"
          visibility="hidden" style="pointer-events:none"></text>
    </g>

  </svg>
  <div class="status-msg" id="status-msg">👆 Click a wheel on the left, then click the matching vehicle on the right.</div>
</div>
<div class="btn-row">
  <button class="main-btn btn-check" onclick="checkAll()">✅ Check Answers</button>
  <button class="main-btn btn-reset" onclick="resetAll()">🔄 Try Again</button>
</div>
<div class="score-banner" id="score-banner">
  <div id="score-text"></div>
  <div class="sub" id="score-sub"></div>
</div>
<script>
  const WHEELS   = ['cart', 'car', 'train', 'cycle'];
  const VEHICLES = ['train', 'cart', 'cycle', 'car'];
  const ROW_Y    = [75, 185, 295, 405];
  const LDOT_X   = 238;
  const RDOT_X   = 430;
  const CORRECT  = {"cart": "cart", "car": "car", "train": "train", "cycle": "cycle"};

  let selectedWheel = null;
  const matched = {};   // vehicleName -> wheelName

  function setStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
  }

  function setWdot(name, state) {
    const dot = document.getElementById('wdot-' + name);
    const img = document.getElementById('wimg-' + name);
    if (state === 'default') {
      dot.setAttribute('fill','white'); dot.setAttribute('stroke','#94a3b8');
      img.setAttribute('opacity','1');
    } else if (state === 'selected') {
      dot.setAttribute('fill','#2563eb'); dot.setAttribute('stroke','#2563eb');
    } else if (state === 'used') {
      dot.setAttribute('fill','#94a3b8'); dot.setAttribute('stroke','#94a3b8');
      img.setAttribute('opacity','0.35');
    } else if (state === 'correct') {
      dot.setAttribute('fill','#16a34a'); dot.setAttribute('stroke','#16a34a');
      img.setAttribute('opacity','1');
    } else if (state === 'wrong') {
      dot.setAttribute('fill','#dc2626'); dot.setAttribute('stroke','#dc2626');
      img.setAttribute('opacity','1');
    }
  }

  function setVdot(name, state) {
    const dot = document.getElementById('vdot-' + name);
    const tag = document.getElementById('vtag-' + name);
    if (state === 'default') {
      dot.setAttribute('fill','white'); dot.setAttribute('stroke','#94a3b8');
      if (tag) tag.setAttribute('fill','#1e3a5f');
    } else if (state === 'filled') {
      dot.setAttribute('fill','#2563eb'); dot.setAttribute('stroke','#2563eb');
    } else if (state === 'correct') {
      dot.setAttribute('fill','#16a34a'); dot.setAttribute('stroke','#16a34a');
      if (tag) tag.setAttribute('fill','#16a34a');
    } else if (state === 'wrong') {
      dot.setAttribute('fill','#dc2626'); dot.setAttribute('stroke','#dc2626');
      if (tag) tag.setAttribute('fill','#dc2626');
    }
  }

  function drawLine(wheelName, vehicleName, color) {
    removeLine(wheelName);
    const wi  = WHEELS.indexOf(wheelName);
    const vi  = VEHICLES.indexOf(vehicleName);
    const wy  = ROW_Y[wi];
    const vy  = ROW_Y[vi];
    const layer = document.getElementById('lines-layer');
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', LDOT_X); line.setAttribute('y1', wy);
    line.setAttribute('x2', RDOT_X); line.setAttribute('y2', vy);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width','2');
    line.setAttribute('stroke-dasharray','7 4');
    line.setAttribute('stroke-linecap','round');
    line.setAttribute('data-wheel', wheelName);
    line.style.pointerEvents = 'none';
    layer.appendChild(line);
  }

  function removeLine(wheelName) {
    const old = document.querySelector('#lines-layer [data-wheel="' + wheelName + '"]');
    if (old) old.remove();
  }

  function selectWheel(name) {
    const dot = document.getElementById('wdot-' + name);
    if (dot.getAttribute('fill') === '#94a3b8') return; // used
    if (selectedWheel && selectedWheel !== name) setWdot(selectedWheel,'default');
    if (selectedWheel === name) {
      selectedWheel = null; setWdot(name,'default');
      setStatus('👆 Click a wheel on the left, then click the matching vehicle on the right.');
      return;
    }
    selectedWheel = name; setWdot(name,'selected');
    setStatus('Now click the matching vehicle on the right 🚗');
  }

  function placeWheel(vehicleName) {
    if (!selectedWheel) { setStatus('👈 First click a wheel on the left!','err'); return; }
    const vdot = document.getElementById('vdot-' + vehicleName);
    if (vdot.getAttribute('fill') !== 'white') {
      setStatus('This vehicle already has a wheel matched!','err'); return;
    }
    matched[vehicleName] = selectedWheel;
    setVdot(vehicleName,'filled');
    const tag = document.getElementById('vtag-' + vehicleName);
    if (tag) { tag.textContent = selectedWheel; tag.setAttribute('visibility','visible'); }
    setWdot(selectedWheel,'used');
    drawLine(selectedWheel, vehicleName, '#3b82f6');
    selectedWheel = null;
    setStatus('✔ Matched! Select another wheel.','ok');
    if (Object.keys(matched).length === 4) setStatus('All matched! Click Check Answers ✅','ok');
  }

  function checkAll() {
    let correct = 0;
    document.getElementById('lines-layer').innerHTML = '';
    VEHICLES.forEach(function(v) {
      if (!matched[v]) return;
      const w = matched[v];
      const isOk = CORRECT[w] === v;
      setVdot(v, isOk ? 'correct' : 'wrong');
      setWdot(w, isOk ? 'correct' : 'wrong');
      drawLine(w, v, isOk ? '#16a34a' : '#dc2626');
      if (isOk) correct++;
    });
    const banner = document.getElementById('score-banner');
    document.getElementById('score-text').textContent = '🎯 You got ' + correct + ' / 4 correct!';
    if (correct === 4) {
      banner.className='score-banner show perfect';
      document.getElementById('score-sub').textContent='Perfect! You matched all wheels correctly! 🌟';
    } else if (correct >= 2) {
      banner.className='score-banner show partial';
      document.getElementById('score-sub').textContent='Good job! Review and try again.';
    } else {
      banner.className='score-banner show poor';
      document.getElementById('score-sub').textContent='Keep practising! Think about which wheel fits which vehicle.';
    }
    setStatus('');
  }

  function resetAll() {
    WHEELS.forEach(function(w) { setWdot(w,'default'); });
    VEHICLES.forEach(function(v) {
      setVdot(v,'default');
      const tag = document.getElementById('vtag-'+v);
      if (tag) { tag.textContent=''; tag.setAttribute('visibility','hidden'); }
      delete matched[v];
    });
    document.getElementById('wimg-cart').setAttribute('opacity','1');
    document.getElementById('wimg-car').setAttribute('opacity','1');
    document.getElementById('wimg-train').setAttribute('opacity','1');
    document.getElementById('wimg-cycle').setAttribute('opacity','1');
    document.getElementById('lines-layer').innerHTML='';
    selectedWheel=null;
    document.getElementById('score-banner').className='score-banner';
    setStatus('👆 Click a wheel on the left, then click the matching vehicle on the right.');
  }
</script>
</body>
</html>
