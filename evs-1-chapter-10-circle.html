<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Circle the Things You Do By Using Water</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#eaf9ff,#ffffff,#eefbf0);
overflow-x:hidden;
}

.quiz-box{
width:100%;
max-width:1100px;
background:#fff;
border:5px solid #00b8f0;
border-radius:30px;
padding:30px 28px 40px;
position:relative;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
}

.quiz-box::before{
content:"";
position:absolute;
top:-70px;
right:-70px;
width:220px;
height:220px;
background:rgba(0,184,240,0.08);
border-radius:50%;
animation:floatOne 8s ease-in-out infinite;
}

.quiz-box::after{
content:"";
position:absolute;
bottom:-70px;
left:-70px;
width:220px;
height:220px;
background:rgba(255,64,129,0.08);
border-radius:50%;
animation:floatTwo 10s ease-in-out infinite;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
position:relative;
z-index:2;
gap:15px;
}

.heading{
font-size:30px;
font-weight:700;
color:#00a8e8;
line-height:1.5;
}

.word-area{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:34px 48px;
position:relative;
z-index:2;
margin-top:20px;
}

.word{
position:relative;
font-size:28px;
font-weight:600;
color:#333;
cursor:pointer;
padding:10px 18px;
transition:0.3s;
user-select:none;
display:inline-block;
}

.word:hover{
transform:scale(1.08);
color:#0096c7;
}

.word svg{
position:absolute;
top:-20px;
left:-22px;
width:calc(100% + 44px);
height:calc(100% + 40px);
pointer-events:none;
display:none;
overflow:visible;
}

.word.circled svg{
display:block;
animation:drawCircle 0.4s ease;
}

.word.correct path{
stroke:#2e7d32;
}

.word.wrong path{
stroke:#c62828;
}

.button-area{
text-align:center;
margin-top:45px;
display:flex;
justify-content:center;
gap:16px;
flex-wrap:wrap;
position:relative;
z-index:2;
}

.check-btn,
.reset-btn{
border:none;
padding:14px 34px;
border-radius:40px;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:0.35s;
color:#fff;
}

.check-btn{
background:linear-gradient(135deg,#00b894,#009688);
}

.reset-btn{
background:linear-gradient(135deg,#ff9800,#ff6f00);
}

.check-btn:hover,
.reset-btn:hover{
transform:translateY(-3px) scale(1.05);
}

.score{
margin-top:28px;
text-align:center;
font-size:34px;
font-weight:700;
color:#0047ab;
}

@keyframes drawCircle{
from{
transform:scale(0.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

@keyframes floatOne{
0%{
transform:translateY(0px);
}
50%{
transform:translateY(15px);
}
100%{
transform:translateY(0px);
}
}

@keyframes floatTwo{
0%{
transform:translateY(-15px);
}
50%{
transform:translateY(0px);
}
100%{
transform:translateY(-15px);
}
}

@media(max-width:768px){

.quiz-box{
padding:20px 14px 30px;
border-radius:22px;
}

.heading{
font-size:22px;
}

.word{
font-size:24px;
padding:8px 12px;
}

.score{
font-size:24px;
}

.button-area{
flex-direction:column;
}

.check-btn,
.reset-btn{
width:100%;
font-size:15px;
padding:13px 16px;
}

}

</style>
</head>

<body>

<div class="quiz-box">

<div class="top-bar">
<div class="heading">
Circle the things you do by using water.
</div>
</div>

<div class="word-area">

<div class="word" data-answer="true">
Drinking water
<svg viewBox="0 0 320 90">
<path d="M20 45 C20 10, 300 10, 300 45 C300 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<!-- FIXED HERE -->
<div class="word" data-answer="true">
Sitting in front of a computer
<svg viewBox="0 0 520 90">
<path d="M20 45 C20 10, 500 10, 500 45 C500 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<div class="word" data-answer="true">
Watering plants
<svg viewBox="0 0 360 90">
<path d="M20 45 C20 10, 340 10, 340 45 C340 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<div class="word" data-answer="false">
Smelling a rose
<svg viewBox="0 0 300 90">
<path d="M20 45 C20 10, 280 10, 280 45 C280 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<div class="word" data-answer="true">
Cleaning the car
<svg viewBox="0 0 340 90">
<path d="M20 45 C20 10, 320 10, 320 45 C320 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<div class="word" data-answer="true">
Washing the pet dog
<svg viewBox="0 0 420 90">
<path d="M20 45 C20 10, 400 10, 400 45 C400 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<div class="word" data-answer="false">
Man driving the car
<svg viewBox="0 0 420 90">
<path d="M20 45 C20 10, 400 10, 400 45 C400 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

<div class="word" data-answer="false">
Playing football
<svg viewBox="0 0 340 90">
<path d="M20 45 C20 10, 320 10, 320 45 C320 80, 20 80, 20 45Z"
fill="none" stroke="#ff4fa0" stroke-width="6"/>
</svg>
</div>

</div>

<div class="button-area">

<button class="check-btn" onclick="checkAnswers()">
Check Answers
</button>

<button class="reset-btn" onclick="resetQuiz()">
Reset
</button>

</div>

<div class="score" id="score">
Score: 0 / 5
</div>

</div>

<script>

const words = document.querySelectorAll(".word");

words.forEach(word=>{

word.addEventListener("click",()=>{

word.classList.toggle("circled");

});

});

function checkAnswers(){

let score = 0;

words.forEach(word=>{

const correct =
word.dataset.answer === "true";

const selected =
word.classList.contains("circled");

word.classList.remove("correct","wrong");

if(correct && selected){

word.classList.add("correct");

score++;

}

else if(!correct && selected){

word.classList.add("wrong");

}

});

document.getElementById("score").innerText =
`Score: ${score} / 5`;

}

function resetQuiz(){

words.forEach(word=>{

word.classList.remove(
"circled",
"correct",
"wrong"
);

});

document.getElementById("score").innerText =
"Score: 0 / 5";

}

</script>

</body>
</html>
