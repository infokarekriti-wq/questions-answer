<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Parts of a Plant</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:#f0f7ff;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;}
  .top-bar{width:100%;max-width:740px;display:flex;align-items:center;
    justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .top-bar h1{font-family:'Baloo 2',cursive;font-size:1.3rem;color:#1e3a5f;font-weight:800;}
  .top-bar h1 b{color:#2563eb;}
  .badge{background:#f97316;color:#fff;font-weight:800;font-size:0.68rem;
    letter-spacing:2px;padding:5px 14px;border-radius:5px;text-transform:uppercase;}
  .card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,0.09);
    padding:20px;width:100%;max-width:740px;}
  #canvas{display:block;width:100%;max-width:700px;margin:0 auto;}
  .btn-row{display:flex;gap:12px;margin-top:16px;justify-content:center;flex-wrap:wrap;}
  .main-btn{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.9rem;
    padding:10px 26px;border-radius:99px;border:none;cursor:pointer;
    transition:transform 0.1s,box-shadow 0.15s;}
  .main-btn:active{transform:scale(0.96);}
  .btn-check{background:#0ea5e9;color:#fff;box-shadow:0 4px 14px rgba(14,165,233,0.3);}
  .btn-check:hover{box-shadow:0 6px 20px rgba(14,165,233,0.4);}
  .btn-reset{background:#e2e8f0;color:#475569;}
  .btn-reset:hover{background:#cbd5e1;}
  .status-msg{font-size:0.83rem;font-weight:700;color:#64748b;
    text-align:center;margin-top:10px;min-height:20px;}
  .status-msg.ok{color:#16a34a;}
  .status-msg.err{color:#dc2626;}
  .score-banner{display:none;margin-top:14px;padding:13px 28px;border-radius:14px;
    text-align:center;font-family:'Baloo 2',cursive;font-size:1.2rem;font-weight:800;
    box-shadow:0 4px 18px rgba(0,0,0,0.09);}
  .score-banner.show{display:block;}
  .score-banner.perfect{background:#dcfce7;color:#14532d;}
  .score-banner.partial{background:#fef9c3;color:#713f12;}
  .score-banner.poor{background:#fee2e2;color:#7f1d1d;}
  .score-banner .sub{font-family:'Nunito',sans-serif;font-size:0.82rem;
    font-weight:600;margin-top:4px;opacity:0.8;}
</style>
</head>

<script>
  const LABELS      = ['Root', 'Flower', 'Branch', 'Leaves', 'Stem', 'Fruit'];
  const LABEL_Y     = [50, 110, 170, 230, 290, 350];
  const LDOT_X      = 134;
  const PILL_COLORS = ['#f5e27a', '#a8d5c2', '#f5e27a', '#a8d5c2', '#f5e27a', '#a8d5c2'];
  const HS = {
    'Root': {x:386.0, y:305.4},
    'Flower': {x:380.0, y:41.4},
    'Branch': {x:430.0, y:137.1},
    'Leaves': {x:320.0, y:170.1},
    'Stem': {x:386.0, y:229.5},
    'Fruit': {x:434.0, y:81.0}
  };

  let selectedLabel = null;
  const matched = {};

  function setStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status-msg' + (type ? ' ' + type : '');
  }

  function setPillStyle(name, state) {
    const pill  = document.getElementById('pill-'  + name);
    const ldot  = document.getElementById('ldot-'  + name);
    const ptext = document.getElementById('ptext-' + name);
    const i = LABELS.indexOf(name);
    const defBg = PILL_COLORS[i];
    pill.setAttribute('opacity','1');
    ptext.setAttribute('fill','#2d4a3e');
    if (state === 'default') {
      pill.setAttribute('fill', defBg); pill.setAttribute('stroke','transparent');
      pill.style.cursor='pointer';
      ldot.setAttribute('fill','white'); ldot.setAttribute('stroke','#94a3b8');
    } else if (state === 'selected') {
      pill.setAttribute('fill', defBg); pill.setAttribute('stroke','#2563eb');
      ldot.setAttribute('fill','#2563eb'); ldot.setAttribute('stroke','#2563eb');
    } else if (state === 'used') {
      pill.setAttribute('fill', defBg); pill.setAttribute('stroke','transparent');
      pill.setAttribute('opacity','0.35'); pill.style.cursor='default';
      ldot.setAttribute('fill','#94a3b8'); ldot.setAttribute('stroke','#94a3b8');
    } else if (state === 'correct') {
      pill.setAttribute('fill','#dcfce7'); pill.setAttribute('stroke','#16a34a');
      ldot.setAttribute('fill','#16a34a'); ldot.setAttribute('stroke','#16a34a');
      ptext.setAttribute('fill','#16a34a');
    } else if (state === 'wrong') {
      pill.setAttribute('fill','#fee2e2'); pill.setAttribute('stroke','#dc2626');
      ldot.setAttribute('fill','#dc2626'); ldot.setAttribute('stroke','#dc2626');
      ptext.setAttribute('fill','#dc2626');
    }
  }

  function setHdotStyle(name, state) {
    const hdot = document.getElementById('hdot-' + name);
    const tag  = document.getElementById('htag-' + name);
    if (state === 'default') {
      hdot.setAttribute('fill','white'); hdot.setAttribute('stroke','#64748b');
      tag.setAttribute('fill','#1e3a5f');
    } else if (state === 'filled') {
      hdot.setAttribute('fill','#2563eb'); hdot.setAttribute('stroke','#2563eb');
    } else if (state === 'correct') {
      hdot.setAttribute('fill','#16a34a'); hdot.setAttribute('stroke','#16a34a');
      tag.setAttribute('fill','#16a34a');
    } else if (state === 'wrong') {
      hdot.setAttribute('fill','#dc2626'); hdot.setAttribute('stroke','#dc2626');
      tag.setAttribute('fill','#dc2626');
    }
  }

  function drawLine(labelName, partName, color) {
    removeLine(labelName);
    const li  = LABELS.indexOf(labelName);
    const ly  = LABEL_Y[li];
    const hpt = HS[partName];
    const layer = document.getElementById('lines-layer');
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', LDOT_X); line.setAttribute('y1', ly);
    line.setAttribute('x2', hpt.x);  line.setAttribute('y2', hpt.y);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width','2');
    line.setAttribute('stroke-dasharray','7 4');
    line.setAttribute('stroke-linecap','round');
    line.setAttribute('data-label', labelName);
    line.style.pointerEvents = 'none';
    layer.appendChild(line);
  }

  function removeLine(labelName) {
    const old = document.querySelector('#lines-layer [data-label="' + labelName + '"]');
    if (old) old.remove();
  }

  function selectLabel(name) {
    const pill = document.getElementById('pill-' + name);
    if (parseFloat(pill.getAttribute('opacity') || 1) < 0.5) return;
    if (selectedLabel && selectedLabel !== name) setPillStyle(selectedLabel,'default');
    if (selectedLabel === name) {
      selectedLabel = null; setPillStyle(name,'default');
      setStatus('👆 Click a label, then click the dot on the correct plant part.');
      return;
    }
    selectedLabel = name; setPillStyle(name,'selected');
    setStatus('Now click the dot on the correct plant part 🌱');
  }

  function placeLabel(partName) {
    if (!selectedLabel) { setStatus('👈 First click a label on the left!','err'); return; }
    const hdot = document.getElementById('hdot-' + partName);
    if (hdot.getAttribute('fill') !== 'white') {
      setStatus('This spot is already filled. Try another.','err'); return;
    }
    matched[partName] = selectedLabel;
    setHdotStyle(partName,'filled');
    const tag = document.getElementById('htag-' + partName);
    tag.textContent = selectedLabel; tag.setAttribute('visibility','visible');
    setPillStyle(selectedLabel,'used');
    drawLine(selectedLabel, partName, '#3b82f6');
    selectedLabel = null;
    setStatus('✔ Placed! Select another label.','ok');
    if (Object.keys(matched).length === 6) setStatus('All placed! Click Check Answers ✅','ok');
  }

  function checkAll() {
    let correct = 0;
    document.getElementById('lines-layer').innerHTML = '';
    LABELS.forEach(function(part) {
      if (!matched[part]) return;
      const isOk = matched[part] === part;
      setHdotStyle(part, isOk ? 'correct' : 'wrong');
      setPillStyle(matched[part], isOk ? 'correct' : 'wrong');
      drawLine(matched[part], part, isOk ? '#16a34a' : '#dc2626');
      if (isOk) correct++;
    });
    const banner = document.getElementById('score-banner');
    document.getElementById('score-text').textContent = '🎯 You got ' + correct + ' / 6 correct!';
    if (correct === 6) {
      banner.className='score-banner show perfect';
      document.getElementById('score-sub').textContent='Perfect! You know all the plant parts! 🌟';
    } else if (correct >= 4) {
      banner.className='score-banner show partial';
      document.getElementById('score-sub').textContent='Good job! Review and try again.';
    } else {
      banner.className='score-banner show poor';
      document.getElementById('score-sub').textContent='Keep practising! Look at each part carefully.';
    }
    setStatus('');
  }

  function resetAll() {
    LABELS.forEach(function(p) {
      setPillStyle(p,'default');
      setHdotStyle(p,'default');
      document.getElementById('pill-'+p).setAttribute('opacity','1');
      document.getElementById('pill-'+p).style.cursor='pointer';
      const tag = document.getElementById('htag-'+p);
      tag.setAttribute('visibility','hidden'); tag.textContent='';
      delete matched[p];
    });
    document.getElementById('lines-layer').innerHTML='';
    selectedLabel=null;
    document.getElementById('score-banner').className='score-banner';
    setStatus('👆 Click a label, then click the dot on the correct plant part.');
  }
</script>
</body>
</html>
