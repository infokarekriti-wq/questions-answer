<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match the Parts of a Plant</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e9f9ff, #fff7d6);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .quiz {
    width: 100%;
    max-width: 1050px;
    background: white;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.15);
  }
  h1 {
    margin: 0 0 18px;
    color: #12a9dc;
    font-size: 30px;
  }
  .wrap {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 25px;
    align-items: center;
  }
  .labels {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .label {
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid #9aa7a7;
    font-size: 22px;
    text-align: center;
    cursor: grab;
    user-select: none;
    background: #fff5ae;
  }
  .label:nth-child(even) { background: #cdebd9; }
  .label.dragging { opacity: .45; }
  .plant-area {
    position: relative;
    min-height: 560px;
    border-radius: 18px;
    background: #ffffff;
    overflow: hidden;
    border: 2px dashed #d5e7d5;
  }
  .plant-img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 310px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .drop {
    position: absolute;
    width: 140px;
    min-height: 42px;
    border: 3px dashed #19a7ce;
    border-radius: 14px;
    background: rgba(255,255,255,.92);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    color: #555;
  }
  .drop.correct {
    border-style: solid;
    border-color: #20b15a;
    background: #dff7e8;
    color: #116b34;
  }
  .drop.wrong {
    border-color: #e94343;
    background: #ffe4e4;
  }
  .flower { left: 410px; top: 48px; }
  .fruit { left: 435px; top: 180px; }
  .leaves { left: 125px; top: 135px; }
  .branch { left: 170px; top: 245px; }
  .stem { left: 360px; top: 330px; }
  .root { left: 355px; top: 455px; }
  .buttons {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    justify-content: center;
  }
  button {
    border: none;
    padding: 13px 26px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    background: #13a8dc;
    color: white;
    font-weight: bold;
  }
  button.secondary { background: #f29922; }
  #score {
    margin-top: 14px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #333;
  }
  @media(max-width: 800px) {
    body { align-items: flex-start; }
    .wrap { grid-template-columns: 1fr; }
    .plant-area { min-height: 560px; }
    .drop { width: 120px; font-size: 15px; }
    .flower { left: 55%; top: 38px; }
    .fruit { left: 60%; top: 175px; }
    .leaves { left: 5%; top: 130px; }
    .branch { left: 10%; top: 245px; }
    .stem { left: 55%; top: 330px; }
    .root { left: 50%; top: 455px; }
  }
</style>
</head>

<script>
let dragged = null;

document.querySelectorAll('.label').forEach(item => {
  item.addEventListener('dragstart', () => {
    dragged = item;
    item.classList.add('dragging');
  });
  item.addEventListener('dragend', () => item.classList.remove('dragging'));
});

document.querySelectorAll('.drop').forEach(box => {
  box.addEventListener('dragover', e => e.preventDefault());
  box.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragged) return;

    if (box.dataset.placed) {
      const old = document.querySelector(`[data-answer="${box.dataset.placed}"]`);
      if (old) {
        old.style.display = 'block';
        document.getElementById('labels').appendChild(old);
      }
    }

    box.textContent = dragged.textContent;
    box.dataset.placed = dragged.dataset.answer;
    box.classList.remove('correct', 'wrong');
    dragged.style.display = 'none';
  });
});

function checkAnswer() {
  let correct = 0;
  document.querySelectorAll('.drop').forEach(box => {
    box.classList.remove('correct', 'wrong');
    if (box.dataset.placed === box.dataset.target) {
      box.classList.add('correct');
      correct++;
    } else {
      box.classList.add('wrong');
    }
  });
  document.getElementById('score').textContent = `Score: ${correct} / 6`;
}

function resetQuiz() {
  document.querySelectorAll('.label').forEach(item => {
    item.style.display = 'block';
    document.getElementById('labels').appendChild(item);
  });
  document.querySelectorAll('.drop').forEach(box => {
    box.textContent = 'Drop here';
    delete box.dataset.placed;
    box.classList.remove('correct', 'wrong');
  });
  document.getElementById('score').textContent = '';
}
</script>
