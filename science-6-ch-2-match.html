<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Match the following</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* SAME CSS (unchanged from your file) */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{min-height:100vh;background:linear-gradient(135deg,#dff6ff,#ffffff,#e8f5e9);display:flex;justify-content:center;align-items:center;padding:20px;}
.quiz-box{width:100%;max-width:1000px;background:#ffffff;border-radius:30px;padding:35px 28px 40px;border:5px solid #00b8f0;box-shadow:0 15px 40px rgba(0,0,0,0.12);position:relative;overflow:hidden;}
.quiz-box::before{content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;background:rgba(0,184,240,0.08);border-radius:50%;}
.quiz-box::after{content:"";position:absolute;bottom:-70px;left:-70px;width:220px;height:220px;background:rgba(255,64,129,0.08);border-radius:50%;}
.heading{font-size:30px;font-weight:700;color:#00a6d6;margin-bottom:30px;position:relative;z-index:2;}
.match-wrapper{position:relative;display:flex;justify-content:space-between;gap:80px;z-index:2;}
.column{width:45%;display:flex;flex-direction:column;gap:20px;}
.item-row{display:flex;align-items:center;justify-content:space-between;background:#f9fcff;border:2px solid #c9efff;border-radius:20px;padding:18px;transition:0.3s;gap:12px;}
.item-row:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,0.08);}
.item-text{font-size:22px;font-weight:500;color:#444;flex:1;line-height:1.5;}
.dot{width:20px;height:20px;min-width:20px;min-height:20px;background:#fff;border:3px solid #ff4fa0;transform:rotate(45deg);cursor:pointer;transition:0.3s;position:relative;z-index:10;}
.dot:hover{transform:rotate(45deg) scale(1.2);}
.dot.active{background:#ff4fa0;}
.dot.connected{background:#009688;border-color:#009688;}
svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1;}
line{stroke:#009688;stroke-width:5;stroke-linecap:round;}
.result{margin-top:30px;text-align:center;font-size:28px;font-weight:700;color:#0047ab;position:relative;z-index:2;}
.buttons{text-align:center;margin-top:24px;position:relative;z-index:2;}
.reset-btn{background:linear-gradient(135deg,#ff9800,#ff6f00);color:#fff;border:none;padding:14px 34px;border-radius:40px;font-size:17px;font-weight:700;cursor:pointer;transition:0.3s;box-shadow:0 8px 18px rgba(255,152,0,0.35);}
.reset-btn:hover{transform:translateY(-2px) scale(1.05);}

@media(max-width:768px){
body{padding:10px;align-items:flex-start;}
.quiz-box{padding:20px 14px 28px;border-radius:22px;}
.heading{font-size:22px;margin-bottom:20px;}
.match-wrapper{gap:10px;}
.column{width:48%;gap:12px;}
.item-row{padding:12px 10px;border-radius:14px;}
.item-text{font-size:14px;}
.dot{width:14px;height:14px;border-width:2px;}
line{stroke-width:3;}
.result{font-size:20px;margin-top:18px;}
.reset-btn{width:100%;font-size:15px;padding:13px;}
}
</style>
</head>

<body>

<div class="quiz-box">

<div class="heading">
Match the following.
</div>

<div class="match-wrapper" id="matchWrapper">

<svg id="svgLines"></svg>

<!-- LEFT SIDE -->

<div class="column">

<div class="item-row">
<div class="item-text">a. Cheetah reintroduction project</div>
<div class="dot left-dot" data-match="vi"></div>
</div>

<div class="item-row">
<div class="item-text">b. Eagle</div>
<div class="dot left-dot" data-match="v"></div>
</div>

<div class="item-row">
<div class="item-text">c. Conifers</div>
<div class="dot left-dot" data-match="iv"></div>
</div>

<div class="item-row">
<div class="item-text">d. Cactus</div>
<div class="dot left-dot" data-match="i"></div>
</div>

<div class="item-row">
<div class="item-text">e. Frog</div>
<div class="dot left-dot" data-match="iii"></div>
</div>

<div class="item-row">
<div class="item-text">f. Yark</div>
<div class="dot left-dot" data-match="iv"></div>
</div>

</div>

<!-- RIGHT SIDE -->

<div class="column">

<div class="item-row">
<div class="dot right-dot" data-id="i"></div>
<div class="item-text">i. Desert Habitat</div>
</div>

<div class="item-row">
<div class="dot right-dot" data-id="ii"></div>
<div class="item-text">ii. Polar Habitat</div>
</div>

<div class="item-row">
<div class="dot right-dot" data-id="iii"></div>
<div class="item-text">iii. Amphibian</div>
</div>

<div class="item-row">
<div class="dot right-dot" data-id="iv"></div>
<div class="item-text">iv. Mountain habitats</div>
</div>

<div class="item-row">
<div class="dot right-dot" data-id="v"></div>
<div class="item-text">v. Aerial Habitat</div>
</div>

<div class="item-row">
<div class="dot right-dot" data-id="vi"></div>
<div class="item-text">vi. 2022</div>
</div>

</div>

</div>

<div class="result" id="result">
Score: 0 / 6
</div>

<div class="buttons">
<button class="reset-btn" onclick="resetGame()">Reset</button>
</div>

</div>

<script>

/* SAME JS LOGIC — ONLY TOTAL UPDATED */

let selectedLeft = null;
let score = 0;
let totalMatched = 0;

const leftDots = document.querySelectorAll(".left-dot");
const rightDots = document.querySelectorAll(".right-dot");

const svg = document.getElementById("svgLines");

leftDots.forEach(dot=>{
dot.addEventListener("click",()=>{
if(dot.classList.contains("connected")) return;
leftDots.forEach(d=>d.classList.remove("active"));
selectedLeft = dot;
dot.classList.add("active");
});
});

rightDots.forEach(dot=>{
dot.addEventListener("click",()=>{
if(!selectedLeft) return;
if(dot.classList.contains("connected")) return;

drawLine(selectedLeft,dot);

const correctMatch = selectedLeft.dataset.match;
const selectedMatch = dot.dataset.id;

selectedLeft.classList.remove("active");
selectedLeft.classList.add("connected");
dot.classList.add("connected");

selectedLeft.style.pointerEvents = "none";
dot.style.pointerEvents = "none";

if(correctMatch === selectedMatch){
score++;
}

totalMatched++;

document.getElementById("result").innerText =
`Score: ${score} / 6`;

selectedLeft = null;

});
});

function drawLine(leftDot,rightDot){

const wrapper = document.getElementById("matchWrapper");

const wrapperRect = wrapper.getBoundingClientRect();

const leftRect = leftDot.getBoundingClientRect();
const rightRect = rightDot.getBoundingClientRect();

const x1 = leftRect.left + leftRect.width/2 - wrapperRect.left;
const y1 = leftRect.top + leftRect.height/2 - wrapperRect.top;
const x2 = rightRect.left + rightRect.width/2 - wrapperRect.left;
const y2 = rightRect.top + rightRect.height/2 - wrapperRect.top;

const line = document.createElementNS("http://www.w3.org/2000/svg","line");

line.setAttribute("x1",x1);
line.setAttribute("y1",y1);
line.setAttribute("x2",x2);
line.setAttribute("y2",y2);

svg.appendChild(line);
}

function resetGame(){

svg.innerHTML = "";

score = 0;
totalMatched = 0;

document.getElementById("result").innerText =
"Score: 0 / 6";

leftDots.forEach(dot=>{
dot.classList.remove("active","connected");
dot.style.pointerEvents = "auto";
});

rightDots.forEach(dot=>{
dot.classList.remove("connected");
dot.style.pointerEvents = "auto";
});

selectedLeft = null;

}

</script>

</body>
</html>
