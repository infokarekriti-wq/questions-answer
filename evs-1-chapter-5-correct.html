<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animals Activity</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef9ff;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.main{
max-width:1150px;
width:100%;
background:#fff;
border:4px solid #00b8f0;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.heading{
font-size:34px;
font-weight:bold;
color:#00a8e8;
line-height:1.5;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:28px;
}

.card{
display:flex;
flex-direction:column;
align-items:center;
}

.card img{
width:100%;
max-width:220px;
border:2px solid #ffb38a;
display:block;
}

/* BUTTONS */

.choice-box{
display:flex;
gap:12px;
margin-top:12px;
}

.btn-box{
width:42px;
height:42px;
border:3px solid #ff2b8a;
background:#fff;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.btn-box:hover{
transform:scale(1.08);
}

.tick-btn.active{
background:#2e7d32;
color:#fff;
border-color:#2e7d32;
}

.cross-btn.active{
background:#c62828;
color:#fff;
border-color:#c62828;
}

/* BUTTON AREA */

.buttons{
margin-top:35px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

button{
border:none;
padding:14px 34px;
border-radius:40px;
font-size:18px;
font-weight:bold;
color:#fff;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-3px) scale(1.05);
}

.check{
background:#009688;
}

.reset{
background:#ff9800;
}

/* SCORE */

.score{
margin-top:25px;
text-align:center;
font-size:30px;
font-weight:bold;
color:#0047ab;
}

/* MOBILE */

@media(max-width:900px){

.grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:768px){

.heading{
font-size:22px;
}

.grid{
grid-template-columns:1fr;
}

.buttons{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

<div class="choice-box">

<div class="btn-box tick-btn"
data-type="land"
data-answer="land">
✓
</div>

<div class="btn-box cross-btn"
data-type="water"
data-answer="land">
×
</div>

</div>

</div>

</div>

<div class="buttons">

<button class="check" onclick="checkAnswers()">
Check Answers
</button>

<button class="reset" onclick="resetQuiz()">
Reset
</button>

</div>

<div class="score" id="score">
Score: 0 / 8
</div>

</div>

<script>

const buttons =
document.querySelectorAll('.btn-box');

/* SELECT ONE OPTION */

buttons.forEach(btn=>{

btn.addEventListener('click',()=>{

const parent =
btn.parentElement;

parent.querySelectorAll('.btn-box')
.forEach(b=>{

b.classList.remove('active');

});

btn.classList.add('active');

});

});

/* CHECK ANSWERS */

function checkAnswers(){

let score = 0;
let incorrect = 0;

const choiceBoxes =
document.querySelectorAll('.choice-box');

choiceBoxes.forEach(box=>{

const selected =
box.querySelector('.active');

if(selected){

const selectedType =
selected.dataset.type;

const correctAnswer =
selected.dataset.answer;

if(selectedType === correctAnswer){

score++;

}
else{

incorrect++;

}

}
else{

incorrect++;

}

});

document.getElementById('score').innerText =
`Score: ${score} / 8`;

alert(
`✅ Correct Answers: ${score}\n❌ Incorrect Answers: ${incorrect}`
);

}

/* RESET */

function resetQuiz(){

buttons.forEach(btn=>{

btn.classList.remove('active');

});

document.getElementById('score').innerText =
'Score: 0 / 8';

}

</script>
