<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Direction Activity</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef9ff;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.main{
width:100%;
max-width:1000px;
background:#fff;
border:4px solid #00b8f0;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.heading{
font-size:28px;
font-weight:700;
color:#00a8e8;
text-align:center;
margin-bottom:20px;
}

.image-box{
width:100%;
display:flex;
justify-content:center;
}

.image-box img{
width:100%;
max-width:800px;
height:auto;
display:block;
}

.inputs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:25px;
}

.input-box{
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
}

input{
width:90%;
border:none;
border-bottom:2px solid #333;
padding:8px;
text-align:center;
font-size:16px;
outline:none;
background:transparent;
}

.correct-text{
color:green;
font-size:14px;
margin-top:5px;
font-weight:600;
}

.button-area{
margin-top:25px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

button{
padding:12px 30px;
border:none;
border-radius:30px;
color:#fff;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.check-btn{
background:#009688;
}

.try-btn{
background:#ff9800;
}

button:hover{
transform:scale(1.05);
}

#result{
margin-top:20px;
text-align:center;
font-size:20px;
font-weight:700;
color:#333;
}

@media(max-width:768px){

.heading{
font-size:22px;
}

.inputs{
grid-template-columns:repeat(2,1fr);
gap:15px;
}

}

@media(max-width:480px){

.inputs{
grid-template-columns:1fr;
}

button{
width:100%;
}

}

</style>
</head>

<div class="button-area">
<button class="check-btn" onclick="checkAnswers()">Check Answer</button>
<button class="try-btn" onclick="tryAgain()">Try Again</button>
</div>

<div id="result"></div>

</div>

<script>

const answers = ["left","up","right","down"];

function checkAnswers(){

let inputs = document.querySelectorAll(".input-box input");
let score = 0;

document.querySelectorAll(".correct-text").forEach(e => e.remove());

inputs.forEach((input,index)=>{

let userAnswer = input.value.trim().toLowerCase();
let correctAnswer = answers[index];

input.style.borderBottom = "2px solid #333";

if(userAnswer === correctAnswer){

input.style.borderBottom = "3px solid green";
score++;

}else{

input.style.borderBottom = "3px solid red";

let answerText = document.createElement("div");
answerText.className = "correct-text";
answerText.innerHTML = "✔ Correct: <b>" + correctAnswer + "</b>";

input.parentNode.appendChild(answerText);

}

});

let wrong = inputs.length - score;

document.getElementById("result").innerHTML =
"✅ Correct: " + score + " / 4 &nbsp;&nbsp;&nbsp; ❌ Wrong: " + wrong;

}

function tryAgain(){

let inputs = document.querySelectorAll(".input-box input");

inputs.forEach((input)=>{

input.value = "";
input.style.borderBottom = "2px solid #333";

});

document.querySelectorAll(".correct-text").forEach(e => e.remove());

document.getElementById("result").innerHTML = "";

}

</script>
