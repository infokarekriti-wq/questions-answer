<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write the Time - Drag and Drop Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef9ff;padding:16px;min-height:100vh}
.main{max-width:1100px;margin:auto;background:#fff;border:4px solid #00b8f0;border-radius:25px;padding:24px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.heading{font-size:30px;font-weight:bold;color:#00a8e8;margin-bottom:10px}
.sub-heading{font-size:16px;color:#444;margin-bottom:18px}
.image-box{width:100%;overflow:hidden;border-radius:18px;background:#f7fdff;padding:8px}
.image-box img{width:100%;max-width:900px;height:auto;display:block;margin:auto}
.quiz-wrap{margin-top:22px;display:grid;grid-template-columns:1fr;gap:18px}
.drop-area{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.drop-box{min-height:88px;border:3px dashed #00a8e8;border-radius:18px;background:#f6fcff;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.2s}
.drop-box.drag-over{background:#dff7ff;transform:scale(1.02)}
.drop-box.correct{border-color:#19a15f;background:#e9fff3}
.drop-box.wrong{border-color:#e53935;background:#fff0f0}
.drop-title{font-weight:bold;color:#006da0;font-size:16px}
.answer-space{width:100%;min-height:38px;border-bottom:2px solid #333;display:flex;align-items:center;justify-content:center;color:#111;font-size:20px;font-weight:bold}
.correct-text{font-size:13px;color:#118043;font-weight:bold;min-height:16px}
.options-title{font-weight:bold;color:#333;margin-top:4px}
.options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:16px;background:#fff9e8;border:2px solid #ffce57;border-radius:18px}
.option{padding:12px 22px;background:#009688;color:white;border-radius:25px;font-size:18px;font-weight:bold;cursor:grab;user-select:none;box-shadow:0 4px 10px rgba(0,0,0,.15);touch-action:none}
.option:active{cursor:grabbing;transform:scale(.98)}
.option.selected{outline:4px solid #ff9800;background:#00796b}
.option.used{opacity:.35;pointer-events:none}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px}
button{padding:12px 25px;border:none;border-radius:25px;background:#009688;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button.secondary{background:#ff9800}
.result{margin-top:12px;font-size:22px;font-weight:bold;color:#0047ab;min-height:30px}
.note{font-size:13px;color:#555;margin-top:8px}
@media(max-width:768px){
 body{padding:10px}
 .main{padding:16px;border-radius:20px}
 .heading{font-size:25px}
 .drop-area{grid-template-columns:repeat(2,1fr);gap:12px}
 .option{font-size:17px;padding:11px 18px}
}
@media(max-width:480px){
 .drop-area{grid-template-columns:1fr}
 .image-box{padding:4px}
 .answer-space{font-size:18px}
 button{width:100%;max-width:260px}
}
</style>
</head>
<body>

  <div class="quiz-wrap">
    <div class="drop-area">
      <div class="drop-box" data-id="t1"><div class="drop-title">Time 1</div><div class="answer-space"></div><div class="correct-text"></div></div>
      <div class="drop-box" data-id="t2"><div class="drop-title">Time 2</div><div class="answer-space"></div><div class="correct-text"></div></div>
      <div class="drop-box" data-id="t3"><div class="drop-title">Time 3</div><div class="answer-space"></div><div class="correct-text"></div></div>
      <div class="drop-box" data-id="t4"><div class="drop-title">Time 4</div><div class="answer-space"></div><div class="correct-text"></div></div>
    </div>

    <div class="options-title">Answer Options</div>
    <div class="options" id="options"></div>

    <div class="buttons">
      <button onclick="checkAnswers()">Check Answers</button>
      <button class="secondary" onclick="resetQuiz()">Try Again</button>
    </div>

    <div class="result" id="result"></div>
    <div class="note">Mobile tip: tap an answer, then tap a box.</div>
  </div>
</div>

<script>
const answers = {
  t1: "1:30",
  t2: "1:50",
  t3: "8:00",
  t4: "5:00"
};

const optionsList = ["1:30", "1:50", "8:00", "5:00"];
let selectedOption = null;
let draggedOption = null;

function loadOptions() {
  const options = document.getElementById("options");
  options.innerHTML = "";
  optionsList.forEach(time => {
    const item = document.createElement("div");
    item.className = "option";
    item.draggable = true;
    item.textContent = time;
    item.dataset.value = time;

    item.addEventListener("dragstart", e => {
      draggedOption = item;
      e.dataTransfer.setData("text/plain", time);
    });

    item.addEventListener("click", () => {
      document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
      selectedOption = item;
      item.classList.add("selected");
    });

    options.appendChild(item);
  });
}

function placeAnswer(box, option) {
  if (!option || option.classList.contains("used")) return;

  const oldValue = box.dataset.value;
  if (oldValue) {
    const oldOption = document.querySelector(`.option[data-value="${oldValue}"]`);
    if (oldOption) oldOption.classList.remove("used");
  }

  box.dataset.value = option.dataset.value;
  box.querySelector(".answer-space").textContent = option.dataset.value;
  option.classList.add("used");
  option.classList.remove("selected");
  selectedOption = null;
  clearBoxStyle(box);
}

function clearBoxStyle(box) {
  box.classList.remove("correct", "wrong", "drag-over");
  box.querySelector(".correct-text").textContent = "";
}

document.querySelectorAll(".drop-box").forEach(box => {
  box.addEventListener("dragover", e => {
    e.preventDefault();
    box.classList.add("drag-over");
  });

  box.addEventListener("dragleave", () => box.classList.remove("drag-over"));

  box.addEventListener("drop", e => {
    e.preventDefault();
    box.classList.remove("drag-over");
    placeAnswer(box, draggedOption);
    draggedOption = null;
  });

  box.addEventListener("click", () => {
    if (selectedOption) placeAnswer(box, selectedOption);
  });
});

function checkAnswers() {
  let score = 0;

  document.querySelectorAll(".drop-box").forEach(box => {
    const id = box.dataset.id;
    const user = box.dataset.value || "";
    const correct = answers[id];
    const correctText = box.querySelector(".correct-text");

    box.classList.remove("correct", "wrong");

    if (user === correct) {
      box.classList.add("correct");
      correctText.textContent = "Correct";
      score++;
    } else {
      box.classList.add("wrong");
      correctText.textContent = "Correct: " + correct;
    }
  });

  const wrong = Object.keys(answers).length - score;
  document.getElementById("result").textContent = `✅ Correct: ${score} / 4   |   ❌ Wrong: ${wrong}`;
}

function resetQuiz() {
  document.querySelectorAll(".drop-box").forEach(box => {
    box.dataset.value = "";
    box.querySelector(".answer-space").textContent = "";
    clearBoxStyle(box);
  });

  document.getElementById("result").textContent = "";
  selectedOption = null;
  draggedOption = null;
  loadOptions();
}

loadOptions();
</script>
