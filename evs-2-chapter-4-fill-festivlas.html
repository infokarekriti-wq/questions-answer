<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Festival Exercise</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f9ff;
padding:15px;
display:flex;
justify-content:center;
}

.main{
max-width:1000px;
width:100%;
background:#fff;
border-radius:20px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* HEADING */
.heading{
color:#00a8e8;
font-size:18px;
font-weight:bold;
margin-bottom:15px;
text-align:center;
}

/* ROW */
.row{
position:relative;
margin-bottom:35px;
}

.row img{
width:100%;
display:block;
}

/* INPUT */
.input{
position:absolute;
width:28%;
height:40px;
border-radius:25px;
border:2px solid #ccc;
text-align:center;
font-size:14px;
background:#fff;
outline:none;
}

/* TOP ROW */
.t1{bottom:-15px; left:5%;}
.t2{bottom:-15px; left:36%;}
.t3{bottom:-15px; left:68%;}

/* BOTTOM ROW */
.b1{bottom:-15px; left:5%;}
.b2{bottom:-15px; left:36%;}
.b3{bottom:-15px; left:68%;}

/* RESULT COLORS */
.correct{border:2px solid green;}
.wrong{border:2px solid red;}

/* HELP BOX */
.helpbox{
margin-top:25px;
padding:12px;
background:#ffe9d6;
border-radius:10px;
text-align:center;
font-weight:bold;
font-size:14px;
}

/* BUTTON */
button{
margin-top:20px;
padding:10px 20px;
border:none;
background:#00a8e8;
color:#fff;
border-radius:25px;
cursor:pointer;
display:block;
margin-left:auto;
margin-right:auto;
}


.btn-wrap{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
}

/* RESULT TEXT */
#resultBox{
margin-top:15px;
text-align:center;
font-weight:bold;
font-size:16px;
}

/* MOBILE */
@media(max-width:768px){

.input{
height:34px;
font-size:12px;
}

}

@media(max-width:480px){

.input{
width:30%;
height:30px;
font-size:11px;
}

}

</style>
</head>

<body>

<div class="heading">

<!-- HELP BOX -->
<div class="helpbox">
Christmas | Ganesh Chaturthi | Janmashtami | Makar Sankranti | Raksha Bandhan | Gurpurab
</div>

<div class="btn-wrap">
<button onclick="check()">Check Answers</button>
<button onclick="resetQuiz()">Reset Quiz</button>
</div>

<div id="resultBox"></div>

</div>

<script>

const answers=[
"ganesh chaturthi",
"christmas",
"makar sankranti",
"gurpurab",
"janmashtami",
"raksha bandhan"
];

function normalize(v){
return v.toLowerCase().trim();
}

function check(){

const inputs=document.querySelectorAll(".input");

let correct=0, incorrect=0;

inputs.forEach((inp,i)=>{
inp.classList.remove("correct","wrong");

if(normalize(inp.value)===answers[i]){
inp.classList.add("correct");
correct++;
}else{
inp.classList.add("wrong");
incorrect++;
}
});

document.getElementById("resultBox").innerHTML =
`✅ Correct: ${correct} | ❌ Incorrect: ${incorrect}`;

}

function resetQuiz(){
const inputs=document.querySelectorAll(".input");
inputs.forEach(inp=>{
inp.value="";
inp.classList.remove("correct","wrong");
});
document.getElementById("resultBox").innerHTML="";
}

</script>
